<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="sbGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="sbGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="sbShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#6366f1" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Squircle Container -->
  <rect width="100" height="100" rx="26" fill="#131b2e"/>
  <rect width="98" height="98" x="1" y="1" rx="25" stroke="url(#sbGrad1)" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Iconic 'S' Service Shield Emblem -->
  <g filter="url(#sbShadow)">
    <!-- Top Ribbon Arc -->
    <path d="M 68 28 C 58 20, 36 20, 30 32 C 25 42, 34 50, 48 53 C 64 56, 75 62, 70 74 C 64 86, 42 86, 30 78" 
          stroke="url(#sbGrad1)" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Dynamic Service Checkmark Accent -->
    <path d="M 43 51 L 51 59 L 68 41" 
          stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Service Node Dots -->
  <circle cx="68" cy="28" r="4.5" fill="#38bdf8"/>
  <circle cx="30" cy="78" r="4.5" fill="#8b5cf6"/>
</svg>
