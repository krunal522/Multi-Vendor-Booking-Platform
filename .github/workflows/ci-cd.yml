name: Multi-Vendor CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # -----------------------------------------------------------
  # 1. CI (Continuous Integration): Test & Verify Code
  # -----------------------------------------------------------
  ci-test-and-build:
    name: 🧪 CI - Verify & Build
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      # Step A: Backend Check
      - name: 📦 Install Backend Dependencies
        run: |
          cd backend
          npm install

      - name: 🔍 Check Backend Syntax
        run: |
          cd backend
          node --check server.js

      # Step B: Frontend Build Check
      - name: 📦 Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: 🏗️ Test Frontend Production Build
        run: |
          cd frontend
          npm run build

  # -----------------------------------------------------------
  # 2. CD (Continuous Deployment): Deploy Frontend to Vercel
  # -----------------------------------------------------------
  cd-deploy-to-vercel:
    name: 🚀 CD - Deploy to Vercel
    needs: ci-test-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 🚀 Deploy Frontend to Vercel
        working-directory: ./frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN || secrets['VERCEL TOKEN'] }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID || secrets['VERCEL ORG ID'] }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID || secrets['VERCEL PROJECT ID'] }}
        run: |
          npx vercel --prod --token="$VERCEL_TOKEN" --yes

